<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "LSerif"; src: url("LiberationSerif-Regular.ttf"); }
@font-face { font-family: "LSerif"; font-style: italic; src: url("LiberationSerif-Italic.ttf"); }
@font-face { font-family: "LSans"; font-weight: 700; src: url("LiberationSans-Bold.ttf"); }
html,body{margin:0;background:#000}
</style></head>
<body>
<canvas id="gl"></canvas>
<canvas id="out"></canvas>
<script>
// v2 overlay engine: crossfades, word-highlight captions, animated HUD/title, grain + vignette, subtle camera breathing.
const W = 1080, H = 1920;
let SPEC, gl, glc, out, ctx, progs = {}, quad, grainC, vign, CAPW = [];

const EASE = {
  "linear": (x) => x,
  "ease-in": (x) => x * x * x,
  "ease-out": (x) => 1 - Math.pow(1 - x, 3),
  "ease-in-out": (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  "hold": (x) => 0,
  "back": (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
};
const clamp01 = (x) => Math.min(1, Math.max(0, x));
function valAt(v, lt, dur) {
  if (typeof v === "number") return v;
  if (Array.isArray(v) && typeof v[0] === "number") return v[0] + (v[1] - v[0]) * EASE["ease-in-out"](clamp01(lt / dur));
  if (lt <= v[0][0]) return v[0][1];
  for (let i = 1; i < v.length; i++) if (lt <= v[i][0]) {
    const [t0, a, e] = v[i - 1], [t1, b] = v[i];
    return a + (b - a) * EASE[e || "ease-in-out"]((lt - t0) / Math.max(1e-6, t1 - t0));
  }
  return v[v.length - 1][1];
}
function compile(name, src, params) {
  const decl = params.map((k) => `uniform float u_${k};`).join("\n");
  const fs = `precision highp float;\nuniform vec2 u_resolution;\nuniform float u_time;\n${decl}\n${src}\nvoid main(){ vec2 uv = gl_FragCoord.xy / u_resolution; uv.y = 1.0 - uv.y; vec4 c = pixel(uv); gl_FragColor = vec4(c.rgb, 1.0); }`;
  const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }`;
  const sh = (type, s) => { const o = gl.createShader(type); gl.shaderSource(o, s); gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(name + ": " + gl.getShaderInfoLog(o)); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(pr, 0, "p"); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(name + " link: " + gl.getProgramInfoLog(pr));
  const loc = { res: gl.getUniformLocation(pr, "u_resolution"), time: gl.getUniformLocation(pr, "u_time") };
  for (const k of params) loc[k] = gl.getUniformLocation(pr, "u_" + k);
  return { pr, loc, params };
}
// Assign word times to each caption phrase (from words.json when available, else proportional).
function buildCaptionWords(S) {
  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
  const words = S.words || [];
  return S.captions.map(([a, b, text]) => {
    const toks = text.split(/\s+/).filter(Boolean);
    const inRange = words.filter((w) => w.s >= a - 0.25 && w.s < b + 0.05);
    let times;
    if (inRange.length === toks.length) times = inRange.map((w) => w.s);
    else {
      const total = toks.reduce((n, t) => n + t.length + 1, 0); let acc = 0;
      times = toks.map((t) => { const x = a + (b - a) * 0.92 * (acc / total); acc += t.length + 1; return x; });
      // snap to nearest spoken word with similar text when possible
      for (let i = 0; i < toks.length; i++) { const m = inRange.find((w) => norm(w.w) === norm(toks[i]) && Math.abs(w.s - times[i]) < 0.8); if (m) times[i] = m.s; }
    }
    return { a, b, toks, times };
  });
}
window.setup = async (spec) => {
  SPEC = spec;
  glc = document.getElementById("gl"); glc.width = spec.glW; glc.height = spec.glH;
  gl = glc.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
  if (!gl) throw new Error("no webgl");
  quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  for (const [name, src] of Object.entries(spec.shaders)) {
    const params = [...new Set(spec.scenes.filter((s) => s.glsl === name).flatMap((s) => Object.keys(s.p)))];
    progs[name] = compile(name, src, params);
  }
  out = document.getElementById("out"); out.width = W; out.height = H; ctx = out.getContext("2d");
  // grain tile + vignette
  grainC = document.createElement("canvas"); grainC.width = 512; grainC.height = 512;
  const g = grainC.getContext("2d"), id = g.createImageData(512, 512);
  for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (Math.random() - 0.5) * 120; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0);
  vign = ctx.createRadialGradient(W / 2, H * 0.48, H * 0.32, W / 2, H * 0.5, H * 0.78);
  vign.addColorStop(0, "rgba(0,0,0,0)"); vign.addColorStop(1, "rgba(0,0,0,0.42)");
  CAPW = buildCaptionWords(spec);
  await document.fonts.load('96px LSerif'); await document.fonts.load('italic 58px LSerif'); await document.fonts.load('700 24px LSans');
  return (gl.getParameter(gl.RENDERER) || "webgl") + " v2";
};

// ---------- helpers ----------
function alphaFade(lt, dur, inD = 0.3, outD = 0.2) { if (lt < 0 || lt > dur) return 0; return Math.min(1, lt / inD, (dur - lt) / outD); }
function txt(s, x, y, font, color, align = "left", shadow = 10, spacing = 0) {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "top";
  ctx.letterSpacing = spacing + "px";
  ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = shadow; ctx.shadowOffsetY = 2;
  ctx.fillText(s, x, y);
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; ctx.letterSpacing = "0px";
}
function wrapToks(toks, font, maxW) {
  ctx.font = font; const sp = ctx.measureText(" ").width; const lines = []; let cur = [], w = 0;
  toks.forEach((t, i) => { const tw = ctx.measureText(t).width; if (cur.length && w + sp + tw > maxW) { lines.push(cur); cur = []; w = 0; } cur.push(i); w += (cur.length > 1 ? sp : 0) + tw; });
  if (cur.length) lines.push(cur);
  if (lines.length > 1 && lines[lines.length - 1].length === 1 && lines[lines.length - 2].length > 2) lines[lines.length - 1].unshift(lines[lines.length - 2].pop());
  return lines;
}
function shadeTop(a) {
  const g = ctx.createLinearGradient(0, 0, 0, 450); g.addColorStop(0, `rgba(0,0,0,${0.5 * a})`); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 450);
}
function hud(h, lt, a) {
  const k = EASE["ease-out"](clamp01(lt / 0.45));
  ctx.globalAlpha = a;
  const dx = (1 - k) * -26;
  ctx.fillStyle = h.dot || "#E8473C"; ctx.beginPath(); ctx.arc(79 + dx, 135, 7 * (0.6 + 0.4 * k + 0.15 * Math.sin(lt * 6) * (lt < 2 ? 1 : 0)), 0, Math.PI * 2); ctx.fill();
  txt(h.cat, 98 + dx, 122, "700 25px LSans", "rgba(255,255,255,0.92)", "left", 8, 2.5);
  txt(h.label, 72 + dx, 168, "700 23px LSans", "rgba(255,255,255,0.75)", "left", 8, 2);
  if (h.value) {
    ctx.save(); ctx.globalAlpha = a * EASE["ease-out"](clamp01((lt - 0.08) / 0.4));
    txt(h.value, 68, 196 + (1 - EASE["ease-out"](clamp01((lt - 0.08) / 0.45))) * 34, "96px LSerif", h.vcol || "#FFFFFF", "left", 16);
    ctx.restore(); ctx.globalAlpha = a;
  }
  // accent rule
  ctx.fillStyle = h.dot || "#E8473C"; ctx.globalAlpha = a * 0.85; ctx.fillRect(72, 300, 120 * EASE["ease-out"](clamp01((lt - 0.15) / 0.5)), 3);
  ctx.globalAlpha = a;
  txt(h.sub, 72, 314, "700 22px LSans", "rgba(255,255,255,0.72)", "left", 8, 2);
  ctx.globalAlpha = 1;
}
function caption(C, t, a) {
  ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, 1180, 0, 1500);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(0.5, "rgba(0,0,0,0.36)"); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 1180, W, 320);
  const font = "italic 60px LSerif"; ctx.font = font; const sp = ctx.measureText(" ").width;
  const lines = wrapToks(C.toks, font, 900);
  const y0 = 1300 - (lines.length - 1) * 35 + (1 - EASE["ease-out"](clamp01((t - C.a) / 0.25))) * 18;
  lines.forEach((idx, li) => {
    const widths = idx.map((i) => ctx.measureText(C.toks[i]).width);
    const total = widths.reduce((s, w) => s + w, 0) + sp * (idx.length - 1);
    let x = W / 2 - total / 2;
    idx.forEach((i, j) => {
      const ts = C.times[i]; const spoken = t >= ts; const cur = spoken && (i === C.toks.length - 1 || t < C.times[i + 1]);
      const pop = cur ? 1 + 0.06 * Math.max(0, 1 - (t - ts) / 0.18) : 1;
      ctx.save(); ctx.translate(x + widths[j] / 2, y0 + li * 70 + 30); ctx.scale(pop, pop);
      txt(C.toks[i], 0, -30, font, cur ? (SPEC.accent || "#FFD866") : spoken ? "#FFFFFF" : "rgba(255,255,255,0.5)", "center", 14);
      ctx.restore();
      x += widths[j] + sp;
    });
  });
  ctx.globalAlpha = 1;
}
function fmtNum(v, dec) { return v.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
function drawScene(sc, t, alpha, zoom) {
  const lt = t - sc.a, dur = sc.b - sc.a;
  const P = progs[sc.glsl]; gl.viewport(0, 0, glc.width, glc.height); gl.useProgram(P.pr);
  gl.uniform2f(P.loc.res, glc.width, glc.height); gl.uniform1f(P.loc.time, t);
  for (const k of P.params) { const v = sc.p[k]; if (v !== undefined && P.loc[k]) gl.uniform1f(P.loc[k], valAt(v, Math.min(lt, dur), dur)); else if (P.loc[k]) gl.uniform1f(P.loc[k], 0); }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ctx.save(); ctx.globalAlpha = alpha; ctx.imageSmoothingQuality = "high";
  const z = zoom, w = W * z, h = H * z; ctx.drawImage(glc, (W - w) / 2, (H - h) / 2, w, h); ctx.restore();
}

function warpT(T) {
  const W2 = SPEC.warp; if (!W2) return T; const P = W2.pairs;
  if (T <= P[0][0]) return P[0][1];
  for (let i = 1; i < P.length; i++) if (T <= P[i][0]) { const [n0, o0] = P[i - 1], [n1, o1] = P[i]; return o0 + (o1 - o0) * (T - n0) / Math.max(1e-6, n1 - n0); }
  return P[P.length - 1][1] + (T - P[P.length - 1][0]);
}
window.frame = (T) => {
  const t = warpT(T);
  const S = SPEC;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = S.bg || "#05060A"; ctx.fillRect(0, 0, W, H);
  const si = Math.max(0, S.scenes.findIndex((s) => t >= s.a && t < s.b) >= 0 ? S.scenes.findIndex((s) => t >= s.a && t < s.b) : S.scenes.length - 1);
  const sc = S.scenes[si];
  const lt = t - sc.a, dur = sc.b - sc.a;
  const endAt = S.endCard ? S.endCard.at : 1e9;
  // --- 3D layer with crossfade from the previous scene and gentle push-in
  if (sc.glsl && t < endAt + 0.5) {
    const xf = sc.cut ? 0 : (sc.xf ?? S.xf ?? 0.35);
    const prev = si > 0 ? S.scenes[si - 1] : null;
    const zoomOf = (s, tt) => 1.0 + 0.035 * clamp01((tt - s.a) / Math.max(0.5, s.b - s.a));
    if (prev && prev.glsl && xf > 0 && lt < xf) {
      drawScene(prev, t, 1, zoomOf(prev, t));
      drawScene(sc, t, EASE["ease-in-out"](lt / xf), zoomOf(sc, t));
    } else drawScene(sc, t, 1, zoomOf(sc, t));
  }
  // --- vignette
  ctx.fillStyle = vign; ctx.fillRect(0, 0, W, H);
  // --- HUD
  const showEl = S.elapsed && t >= S.elapsed.start && t < S.elapsed.end;
  if (sc.hud || showEl) shadeTop(1);
  if (sc.hud) {
    const h = sc.hud, at = h.at || 0;
    const a = alphaFade(lt - at, dur - at, 0.25, 0.2);
    if (a > 0) {
      let hv = h;
      if (h.counter) { const c = h.counter; const x = clamp01((lt - c.at) / c.dur); const e = EASE[c.easing || "ease-in"](x);
        hv = { ...h, value: (c.prefix || "") + fmtNum(c.from + (c.to - c.from) * e, c.dec || 0) + (c.suffix || "") }; }
      hud(hv, lt - at, a);
    }
  }
  for (const h of S.huds || []) { const a = alphaFade(t - h.at, h.dur, 0.25, 0.2); if (a > 0) hud(h, t - h.at, a); }
  if (showEl) {
    const E = S.elapsed; let v = 0; const P = E.points;
    if (t <= P[0][0]) v = P[0][1]; else { v = P[P.length - 1][1]; for (let i = 1; i < P.length; i++) if (t <= P[i][0]) { const [a0, x0] = P[i - 1], [b0, y0] = P[i]; v = x0 + (y0 - x0) * (t - a0) / (b0 - a0); break; } }
    const a = Math.min(1, (t - E.start) / 0.2, (E.end - t) / 0.15);
    ctx.globalAlpha = a;
    txt(E.label || "ELAPSED", 1008, 124, "700 22px LSans", "rgba(255,255,255,0.75)", "right", 8, 2);
    txt(fmtNum(v, E.dec ?? 1) + (E.unit || " s"), 1008, 152, "54px LSerif", "#FFFFFF", "right", 10);
    if (E.note) txt(E.note, 1008, 226, "700 20px LSans", "rgba(255,255,255,0.6)", "right", 8, 2);
    // progress ring
    const prog = clamp01((t - E.start) / Math.max(1, E.end - E.start));
    ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(1008 - 180, 262); ctx.lineTo(1008, 262); ctx.stroke();
    ctx.strokeStyle = S.accent || "#FFD866"; ctx.beginPath(); ctx.moveTo(1008 - 180, 262); ctx.lineTo(1008 - 180 + 180 * prog, 262); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // --- title: words rise in one by one
  if (S.title && t < S.title.end) {
    const a = Math.min(1, (S.title.end - t) / 0.25);
    const font = "92px LSerif"; const toks = S.title.text.split(" "); const lines = wrapToks(toks, font, 960);
    ctx.font = font; const sp = ctx.measureText(" ").width;
    let k = 0;
    lines.forEach((idx, li) => {
      const widths = idx.map((i) => ctx.measureText(toks[i]).width);
      let x = W / 2 - (widths.reduce((s, w) => s + w, 0) + sp * (idx.length - 1)) / 2;
      idx.forEach((i, j) => {
        const e = EASE["ease-out"](clamp01((t - 0.05 - k * 0.07) / 0.35)); k++;
        ctx.globalAlpha = a * e;
        txt(toks[i], x + widths[j] / 2, 320 + li * 104 + (1 - e) * 30, font, "#FFFFFF", "center", 20);
        x += widths[j] + sp;
      });
    });
    ctx.globalAlpha = 1;
  }
  // --- captions (word highlight)
  for (const C of CAPW) { const a = alphaFade(t - C.a, C.b - C.a, 0.15, 0.15); if (a > 0) caption(C, t, a); }
  // --- big centre text with pop
  for (const B of S.bigs || []) { const lt2 = t - B.at; const a = alphaFade(lt2, B.dur, 0.08, 0.25); if (a > 0) {
    ctx.globalAlpha = a; ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillRect(0, 0, W, H);
    const s = 1.25 - 0.25 * EASE["ease-out"](clamp01(lt2 / 0.3));
    ctx.save(); ctx.translate(W / 2, (B.y || 700) + 130); ctx.scale(s, s);
    txt(B.text, 0, -130, `${B.size || 260}px LSerif`, B.color || "#FFFFFF", "center", 30); ctx.restore(); ctx.globalAlpha = 1; } }
  // --- flashes
  for (const f of S.flashes || []) { const d = f.dur || 0.45; if (t >= f.at && t < f.at + d) { ctx.globalAlpha = 0.85 * (1 - (t - f.at) / d); ctx.fillStyle = f.color || "#FFFFFF"; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; } }
  // --- end card
  if (S.endCard && t >= S.endCard.at) {
    const E = S.endCard, le = t - E.at; ctx.globalAlpha = Math.min(1, le / 0.4);
    ctx.fillStyle = "#05060A"; ctx.fillRect(0, 0, W, H);
    const font = "76px LSerif"; const toks = E.title.split(" "); const lines = wrapToks(toks, font, 880);
    ctx.font = font;
    lines.forEach((idx, i) => txt(idx.map((j) => toks[j]).join(" "), W / 2, 680 + i * 88, font, "#FFFFFF", "center", 0));
    let y = 700 + lines.length * 88 + 80;
    for (const l of E.small || []) { txt(l, W / 2, y, "700 24px LSans", "rgba(255,255,255,0.62)", "center", 0, 2.5); y += 36; }
    y += 80;
    const pulse = 1 + 0.03 * Math.sin(le * 5);
    ctx.save(); ctx.translate(W / 2, y + 20); ctx.scale(pulse, pulse);
    txt(E.cta || "WHERE WOULD YOU BE STANDING?", 0, -20, "700 36px LSans", SPEC.accent || "#FFD866", "center", 0, 2.5); ctx.restore();
    txt(E.follow || "FOLLOW FOR MORE WHAT IFS", W / 2, y + 66, "700 22px LSans", "rgba(255,255,255,0.5)", "center", 0, 2.5);
    ctx.globalAlpha = 1;
  }
  // --- film grain
  ctx.save(); ctx.globalAlpha = 0.06; ctx.globalCompositeOperation = "overlay";
  const ox = Math.floor(Math.random() * 512), oy = Math.floor(Math.random() * 512);
  for (let y = -oy; y < H; y += 512) for (let x = -ox; x < W; x += 512) ctx.drawImage(grainC, x, y);
  ctx.restore();
};
window.grab = (q) => out.toDataURL("image/jpeg", q || 0.93);
</script>
</body></html>
